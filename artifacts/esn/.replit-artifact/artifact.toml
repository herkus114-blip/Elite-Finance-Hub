kind = "web"
previewPath = "/"
title = "Elite Settlement Network"
version = "1.0.0"
id = "artifacts/esn"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25399

[services.development]
run = "pnpm --filter @workspace/esn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/esn", "run", "build" ]
publicDir = "artifacts/esn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25399"
BASE_PATH = "/"
